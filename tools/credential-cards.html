<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --ink:#0B0F17; --panel:#0E1626; --cyan:#00F2FE; --purple:#9D4EDD; --blue:#4EA8FF;
    --text:#EAF0FA; --dim:#93A2BC; --faint:#63718C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;font-family:Outfit,system-ui,sans-serif}

  /* 520x660 — exactly 2x the gallery's 260x330 card, so it stays crisp. */
  .card{
    position:relative; width:520px; height:660px; overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(0,242,254,.13) 0%, rgba(0,242,254,0) 55%),
      radial-gradient(100% 70% at 50% 110%, rgba(157,78,221,.16) 0%, rgba(157,78,221,0) 60%),
      linear-gradient(168deg,#101A2C 0%,#0A0E18 62%);
    display:flex; flex-direction:column; justify-content:space-between;
    padding:52px 46px 46px;
  }
  /* brand hairline along the top edge */
  .card::before{
    content:''; position:absolute; left:46px; right:46px; top:0; height:3px;
    background:linear-gradient(90deg,var(--cyan) 0%,var(--blue) 45%,var(--purple) 100%);
    border-radius:0 0 3px 3px;
  }
  /* a faint hex/grid wash so the flat panel has some texture */
  .card::after{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(75% 60% at 50% 40%, #000 0%, transparent 78%);
  }

  .top{position:relative;z-index:2}
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;
    letter-spacing:.22em; text-transform:uppercase; color:var(--cyan);
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);display:block}

  .mark{
    margin-top:44px; width:104px; height:104px; border-radius:26px;
    display:grid; place-items:center;
    background:linear-gradient(150deg, rgba(0,242,254,.16), rgba(157,78,221,.14));
    border:1px solid rgba(0,242,254,.30);
    box-shadow:0 0 44px rgba(0,242,254,.14), inset 0 1px 0 rgba(255,255,255,.09);
  }
  .mark svg{width:52px;height:52px;stroke:var(--cyan);fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}

  .mid{position:relative;z-index:2;margin-top:auto;padding-top:34px}
  h2{
    font-size:39px; line-height:1.1; font-weight:800; color:var(--text);
    letter-spacing:-.015em;
  }
  h2 em{
    font-style:normal;
    background:linear-gradient(100deg,var(--cyan),var(--blue) 55%,var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p{margin-top:16px; font-size:16.5px; line-height:1.55; color:var(--dim); max-width:44ch}

  .foot{
    position:relative;z-index:2; margin-top:30px; padding-top:22px;
    border-top:1px solid rgba(255,255,255,.09);
    display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:500;
    color:var(--dim); border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.04); border-radius:7px; padding:6px 10px;
  }
  .num{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--faint);
    white-space:nowrap;
  }
  /* corner brackets, the motif this page already uses */
  .br{position:absolute;width:26px;height:26px;border-color:rgba(0,242,254,.55);z-index:3}
  .br.tl{top:26px;left:22px;border-top:2px solid;border-left:2px solid}
  .br.br2{bottom:22px;right:22px;border-bottom:2px solid;border-right:2px solid;border-color:rgba(157,78,221,.55)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const ICONS = {
  cloud:'<path d="M6 18h11a4 4 0 0 0 .6-7.96A6 6 0 0 0 5.6 9.2 4.4 4.4 0 0 0 6 18Z"/>',
  stack:'<path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 17 12 21.5 21 17"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/>',
  chip:'<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M4 10h3M4 14h3M17 10h3M17 14h3M10 4v3M14 4v3M10 17v3M14 17v3"/>',
  shield:'<path d="M12 3 5 6v6c0 4.5 3 7.6 7 9 4-1.4 7-4.5 7-9V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>',
  pin:'<path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/>',
};
const CARDS = [
  { id:'card-aws',       icon:'cloud',  eyebrow:'Cloud Partner',      t1:'Amazon Web', t2:'Services',
    body:'Bedrock foundation models, SageMaker training clusters and P5 GPU capacity, run inside your own VPC.',
    chips:['Bedrock','SageMaker','P5 GPU','VPC isolated'], n:'01 / 06' },
  { id:'card-microsoft', icon:'stack',  eyebrow:'Cloud Partner',      t1:'Microsoft', t2:'Cloud',
    body:'Azure OpenAI and Azure ML behind your own tenancy, with Entra identity and private endpoints throughout.',
    chips:['Azure OpenAI','Azure ML','Entra ID','Private link'], n:'02 / 06' },
  { id:'card-google',    icon:'globe',  eyebrow:'Cloud Partner',      t1:'Google Cloud', t2:'Platform',
    body:'Vertex AI and Gemini models on GKE, with BigQuery as the warehouse the retrieval layer reads from.',
    chips:['Vertex AI','Gemini','GKE','BigQuery'], n:'03 / 06' },
  { id:'card-nvidia',    icon:'chip',   eyebrow:'Compute Ecosystem',  t1:'NVIDIA AI', t2:'Ecosystem',
    body:'Triton inference servers and TensorRT-optimised models on A100 and H100 clusters, tuned for throughput.',
    chips:['Triton','TensorRT','A100 / H100','CUDA'], n:'04 / 06' },
  { id:'card-security',  icon:'shield', eyebrow:'Governance',         t1:'Security &', t2:'Compliance',
    body:'Built to ISO/IEC 27001, SOC 2 Type II and the NIST AI Risk Management Framework, with PII redaction and RBAC.',
    chips:['ISO/IEC 27001','SOC 2 Type II','NIST AI RMF','GDPR · HIPAA'], n:'05 / 06' },
  { id:'card-hubs',      icon:'pin',    eyebrow:'Delivery Network',   t1:'Chennai &', t2:'Bangalore Hubs',
    body:'Engineering centres in Chennai, Bangalore, Hyderabad and Coimbatore, delivering to India, the US, UK and UAE.',
    chips:['Chennai HQ','Bangalore','Hyderabad','Coimbatore'], n:'06 / 06' },
];
document.getElementById('stage').innerHTML = CARDS.map(c => `
  <div class="card" id="${c.id}">
    <span class="br tl"></span><span class="br br2"></span>
    <div class="top">
      <div class="eyebrow"><i></i>${c.eyebrow}</div>
      <div class="mark"><svg viewBox="0 0 24 24">${ICONS[c.icon]}</svg></div>
    </div>
    <div class="mid">
      <h2>${c.t1}<br><em>${c.t2}</em></h2>
      <p>${c.body}</p>
      <div class="foot">
        <div class="chips">${c.chips.map(x=>`<span class="chip">${x}</span>`).join('')}</div>
        <span class="num">${c.n}</span>
      </div>
    </div>
  </div>`).join('');
window.__ids = CARDS.map(c=>c.id);
</script>
</body>
</html>
