<!DOCTYPE html>
<!--
  The six credential cards the AI Development Company page's cover flow gallery
  shows (section four, includes/components/aidev/awards-strip.php).

  They are rendered here rather than generated, because a credential card is
  mostly words — "ISO/IEC 27001", "SOC 2 Type II", "TensorRT", "A100 / H100" —
  and no image model sets that text without mangling it. Each card carries a
  photograph in its head and real type below it.

  TO REGENERATE, after editing anything here:
      node tools/render-cards.mjs
  which screenshots each .card at 520x660 — twice the gallery's 260x330, so the
  type stays sharp — into assets/img/aidev/cards/.

  The head images live in assets/img/aidev/cardart/ and are referenced relative
  to the repo root, so open this file from the project directory.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --cyan:#00F2FE; --purple:#9D4EDD; --blue:#4EA8FF;
    --text:#EAF0FA; --dim:#93A2BC; --faint:#63718C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;font-family:Outfit,system-ui,sans-serif}

  /* 520x660 — exactly 2x the gallery's 260x330 card. */
  .card{
    position:relative; width:520px; height:660px; overflow:hidden;
    background:linear-gradient(168deg,#101A2C 0%,#0A0E18 62%);
    display:flex; flex-direction:column;
  }

  /* --- the head: a photograph, faded into the card body ------------------ */
  .head{position:relative; height:340px; flex:0 0 340px; overflow:hidden}
  .head img{width:100%;height:100%;object-fit:cover;display:block}
  /* Fades the picture into the panel so the card is one object rather than a
     photo with a caption stapled under it. */
  .head::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(8,11,20,.78) 0%,
      rgba(10,14,24,.16) 26%,
      rgba(10,14,24,.10) 46%,
      rgba(10,14,24,.74) 80%,
      #0C1220 100%);
  }
  /* brand hairline across the top edge */
  .card::before{
    content:''; position:absolute; left:0; right:0; top:0; height:4px; z-index:4;
    background:linear-gradient(90deg,var(--cyan) 0%,var(--blue) 45%,var(--purple) 100%);
  }
  .eyebrow{
    position:absolute; z-index:3; left:40px; top:34px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700;
    letter-spacing:.22em; text-transform:uppercase; color:var(--cyan);
    display:flex; align-items:center; gap:9px;
    text-shadow:0 2px 14px rgba(0,0,0,.85);
  }
  .eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 12px var(--cyan);display:block;flex:0 0 auto}

  /* --- the body ---------------------------------------------------------- */
  .body{position:relative; z-index:2; flex:1; display:flex; flex-direction:column;
    padding:0 40px 40px; margin-top:-26px}
  h2{font-size:37px; line-height:1.08; font-weight:800; color:var(--text); letter-spacing:-.015em}
  h2 em{
    font-style:normal;
    background:linear-gradient(100deg,var(--cyan),var(--blue) 55%,var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p{margin-top:15px; font-size:16px; line-height:1.55; color:var(--dim)}

  .foot{
    margin-top:auto; padding-top:22px; border-top:1px solid rgba(255,255,255,.09);
    display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500;
    color:var(--dim); border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.04); border-radius:7px; padding:5px 9px;
  }
  .num{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--faint); white-space:nowrap}

  /* corner brackets, the motif the page already uses */
  .br{position:absolute;width:24px;height:24px;z-index:5}
  .br.tl{top:26px;left:20px;border-top:2px solid rgba(0,242,254,.6);border-left:2px solid rgba(0,242,254,.6)}
  .br.rb{bottom:20px;right:20px;border-bottom:2px solid rgba(157,78,221,.6);border-right:2px solid rgba(157,78,221,.6)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const CARDS = [
  { id:'aws', eyebrow:'Cloud Partner', t1:'Amazon Web', t2:'Services',
    body:'Bedrock foundation models, SageMaker training clusters and P5 GPU capacity, run inside your own VPC.',
    chips:['Bedrock','SageMaker','P5 GPU','VPC isolated'], n:'01 / 06' },
  { id:'microsoft', eyebrow:'Cloud Partner', t1:'Microsoft', t2:'Cloud',
    body:'Azure OpenAI and Azure ML behind your own tenancy, with Entra identity and private endpoints throughout.',
    chips:['Azure OpenAI','Azure ML','Entra ID','Private link'], n:'02 / 06' },
  { id:'google', eyebrow:'Cloud Partner', t1:'Google Cloud', t2:'Platform',
    body:'Vertex AI and Gemini models on GKE, with BigQuery as the warehouse the retrieval layer reads from.',
    chips:['Vertex AI','Gemini','GKE','BigQuery'], n:'03 / 06' },
  { id:'nvidia', eyebrow:'Compute Ecosystem', t1:'NVIDIA AI', t2:'Ecosystem',
    body:'Triton inference servers and TensorRT-optimised models on A100 and H100 clusters, tuned for throughput.',
    chips:['Triton','TensorRT','A100 / H100','CUDA'], n:'04 / 06' },
  { id:'security', eyebrow:'Governance', t1:'Security &amp;', t2:'Compliance',
    body:'Built to ISO/IEC 27001, SOC 2 Type II and the NIST AI Risk Management Framework, with PII redaction and RBAC.',
    chips:['ISO/IEC 27001','SOC 2 Type II','NIST AI RMF','GDPR · HIPAA'], n:'05 / 06' },
  { id:'hubs', eyebrow:'Delivery Network', t1:'Chennai &amp;', t2:'Bangalore Hubs',
    body:'Engineering centres in Chennai, Bangalore, Hyderabad and Coimbatore, delivering to India, the US, UK and UAE.',
    chips:['Chennai HQ','Bangalore','Hyderabad','Coimbatore'], n:'06 / 06' },
];
document.getElementById('stage').innerHTML = CARDS.map(c => `
  <div class="card" id="card-${c.id}">
    <span class="br tl"></span><span class="br rb"></span>
    <div class="head">
      <img src="../assets/img/aidev/cardart/${c.id}.jpg" alt="">
      <div class="eyebrow"><i></i>${c.eyebrow}</div>
    </div>
    <div class="body">
      <h2>${c.t1}<br><em>${c.t2}</em></h2>
      <p>${c.body}</p>
      <div class="foot">
        <div class="chips">${c.chips.map(x=>`<span class="chip">${x}</span>`).join('')}</div>
        <span class="num">${c.n}</span>
      </div>
    </div>
  </div>`).join('');
window.__ids = CARDS.map(c=>'card-'+c.id);
</script>
</body>
</html>
